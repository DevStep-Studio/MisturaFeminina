server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/security-headers.conf;
  location = /health.json { try_files $uri =404; expires -1; }
  location ~* \.map$ { return 404; }
  location /assets/ { try_files $uri =404; expires 1y; }
  location = /robots.txt { try_files $uri =404; }
  location = /sitemap.xml { try_files $uri =404; }
  location = /llms.txt { try_files $uri =404; }
  location = /merchant-feed.xml { return 404; }
  # Em produção com backend Laravel no mesmo domínio, faça proxy de /sitemap.xml, /robots.txt, /llms.txt e /merchant-feed.xml para a API.
  location / { try_files $uri $uri/ /index.html; }
}

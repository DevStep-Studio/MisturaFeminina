# Include inside the Nginx HTTPS server block. Start with CSP in report-only mode.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;
# Enable only on the definitive HTTPS origin; never on local HTTP.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Replace the backend origin. Add exact GTM/GA/Sentry origins only when enabled.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.seudominio.com.br; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

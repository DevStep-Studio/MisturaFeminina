<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#C22583" />
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body class="bg-white font-sans text-zinc-900 antialiased">
    <div
      id="startup"
      class="grid min-h-svh place-items-center bg-white px-6 font-sans text-zinc-900"
      role="status"
      aria-live="polite"
    >
      <div class="flex flex-col items-center text-center">
        <div class="relative flex size-28 items-center justify-center">
          <span
            class="absolute inset-0 rounded-full border border-[#EACEEE] bg-[#FDF9FE] shadow-[0_4px_24px_rgba(147,80,158,0.12)] motion-safe:animate-pulse"
            aria-hidden="true"
          ></span>
          <span
            class="absolute inset-1.5 rounded-full border-2 border-dashed border-[#93509e]/40 motion-safe:animate-[spin_10s_linear_infinite]"
            aria-hidden="true"
          ></span>
          <span
            class="absolute inset-0 rounded-full border-2 border-transparent border-t-[#93509e] border-r-[#93509e] motion-safe:animate-[spin_1.4s_cubic-bezier(0.4,0,0.2,1)_infinite]"
            aria-hidden="true"
          ></span>
          <div
            class="relative z-10 flex size-16 items-center justify-center rounded-full bg-white p-2.5 shadow-sm"
            aria-hidden="true"
          >
            <img
              src="/logo-mf.png"
              alt=""
              class="mf-logo-spin-3d h-10 w-auto max-w-[48px] object-contain"
            />
          </div>
        </div>
        <p class="mt-4 text-sm font-bold text-[#2E0C49]">
          Mistura Feminina Cosméticos
        </p>
        <p class="mt-0.5 text-xs text-[#5B486B]">
          Carregando a melhor experiência para você...
        </p>
      </div>
    </div>
    <div id="root"></div>
    <noscript
      >Ative o JavaScript para acessar a loja Mistura Feminina
      Cosméticos.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

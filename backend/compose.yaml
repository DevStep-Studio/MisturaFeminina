x-app: &app
  build: .
  env_file: .env
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  app:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
  horizon:
    <<: *app
    command: php artisan horizon
  scheduler:
    <<: *app
    command: php artisan schedule:work
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: devstep
      MYSQL_USER: devstep
      MYSQL_PASSWORD: devstep_local
      MYSQL_ROOT_PASSWORD: root_local
    volumes: ["mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot_local"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
volumes:
  mysql:
  redis:
  vendor:

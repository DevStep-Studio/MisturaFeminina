name: Backend quality
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: devstep_test
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -ptest" --health-interval=10s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      PAO_DISABLE: 1
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: devstep_test
      DB_USERNAME: root
      DB_PASSWORD: test
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, redis, pcntl, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: composer validate --strict
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=512M
      - run: vendor/bin/pest
      - run: php artisan migrate:fresh --force && php artisan devstep:health
      - run: php artisan scramble:export --path=docs/openapi.json
      - run: composer audit
      - name: Build deployment artifact
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          tar --exclude=.env --exclude=tests --exclude=node_modules --exclude=.git --exclude='storage/logs/*' --exclude='storage/framework/sessions/*' -czf /tmp/devstep-api.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: devstep-api
          path: /tmp/devstep-api.tar.gz
